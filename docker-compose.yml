version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: journalpix-postgres
    environment:
      POSTGRES_USER: journalpix
      POSTGRES_PASSWORD: journalpix123
      POSTGRES_DB: journalpix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journalpix"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: journalpix-backend
    environment:
      DATABASE_URL: postgres://journalpix:journalpix123@postgres:5432/journalpix
      JWT_SECRET: super_secret_jwt_key_12345
      JWT_EXPIRATION_DAYS: 30
      UPLOAD_DIR: /app/uploads
      THUMBNAIL_DIR: /app/thumbnails
      SERVER_PORT: 8080
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080,http://10.0.2.2:8080
    ports:
      - "8080:8080"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/thumbnails:/app/thumbnails
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Android emulator service (optional for local development)
  # android:
  #   image: android-emulator
  #   ...

volumes:
  postgres_data:
