[package]
name = "journalpix-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = "4.4"
actix-multipart = "0.6"
actix-cors = "0.7"

# Database
Diesel = { version = "2.1", features = ["postgres", "chrono", "uuid"] }
bb8 = "0.8"
bb8-postgres = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Authentication
jsonwebtoken = "8.3"
bcrypt = "0.15"

# File handling
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
uuid = { version = "1.4", features = ["v4", "serde"] }

# Image processing
exif = "0.6"
image = "0.24"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Environment
dotenv = "0.15"

# Validation
validator = { version = "0.16", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
actix-rt = "2.8"
