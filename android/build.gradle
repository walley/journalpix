// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    dependencies {
        // Pin KGP above AGP's default (2.2.10) for OpenMapView 0.21 (requires Kotlin 2.3+)
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0'
    }
}

plugins {
    id 'com.android.application' version '9.5.0' apply false
    // AGP 9 has built-in Kotlin — do not apply org.jetbrains.kotlin.android
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21' apply false
    id 'org.jetbrains.kotlin.plugin.parcelize' version '2.4.21' apply false
}

ext {
    coroutines_version = '1.10.1'
    retrofit_version = '2.11.0'
    okhttp_version = '4.12.0'
    room_version = '2.6.1'
    coil_version = '2.7.0'
    lifecycle_version = '2.8.7'
    navigation_version = '2.8.5'
    jwt_decode_version = '2.0.2'
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
