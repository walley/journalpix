// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '9.1.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.3.0' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.3.0' apply false
    id 'org.jetbrains.kotlin.kapt' version '2.3.0' apply false
    id 'org.jetbrains.kotlin.plugin.parcelize' version '2.3.0' apply false
}

ext {
    // Shared dependency versions (Compose BOM manages Compose artifacts)
    coroutines_version = '1.10.1'
    retrofit_version = '2.11.0'
    okhttp_version = '4.12.0'
    room_version = '2.6.1'
    coil_version = '2.7.0'
    lifecycle_version = '2.8.7'
    navigation_version = '2.8.5'
    jwt_decode_version = '2.0.2'
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
