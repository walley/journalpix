plugins {
    id 'com.android.application'
    // Built-in Kotlin (AGP 9+) — do not apply org.jetbrains.kotlin.android
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.parcelize'
}

android {
    namespace 'com.journalpix'
    compileSdk 37

    defaultConfig {
        applicationId 'com.journalpix'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '1.0.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        viewBinding true
    }
    packaging {
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

dependencies {
    // Kotlin
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:' + coroutines_version
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'

    // Android
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'

    // Compose (BOM)
    def composeBom = platform('androidx.compose:compose-bom:2025.10.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:' + lifecycle_version
    implementation 'androidx.navigation:navigation-compose:' + navigation_version

    // Coil for image loading
    implementation 'io.coil-kt:coil-compose:' + coil_version
    implementation 'io.coil-kt:coil-gif:' + coil_version

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:' + retrofit_version
    implementation 'com.squareup.retrofit2:converter-gson:' + retrofit_version
    implementation 'com.squareup.retrofit2:converter-scalars:' + retrofit_version
    implementation 'com.squareup.okhttp3:okhttp:' + okhttp_version
    implementation 'com.squareup.okhttp3:logging-interceptor:' + okhttp_version

    // Room Database (runtime only — annotation processor removed)
    implementation 'androidx.room:room-runtime:' + room_version
    implementation 'androidx.room:room-ktx:' + room_version

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:' + lifecycle_version
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:' + lifecycle_version
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:' + lifecycle_version

    // JWT
    implementation 'com.auth0.android:jwtdecode:' + jwt_decode_version

    // Location services
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // OpenMapView - Map library (Maven Central)
    implementation 'de.afarber:openmapview:0.21.0'
    implementation 'de.afarber:openmapview-compose:0.21.0'

    // File picker
    implementation 'com.github.nguyenhoanglam:ImagePicker:1.6.4'

    // Permissions
    implementation 'com.karumi:dexter:6.2.3'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
