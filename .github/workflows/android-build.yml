name: Android Build and Release

on:
  push:
    branches: [ github, main ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ github, main ]
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # API 37 introduced major.minor platform package IDs (android-37.0)
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          accept-android-sdk-licenses: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Debug list repository android dir
        run: |
          echo "Repository root:"
          ls -la
          echo
          echo "android/ (if present):"
          ls -la android || echo "android directory missing"

      - name: Run Gradle builds (handle gradlew location)
        run: |
          set -e
          if [ -f "android/gradlew" ]; then
            echo "Found android/gradlew — running from android/"
            chmod +x android/gradlew
            cd android
            ./gradlew assembleDebug
            ./gradlew assembleRelease
          elif [ -f "./gradlew" ]; then
            echo "Found repository root gradlew — using it with -p android"
            chmod +x ./gradlew
            ./gradlew -p android assembleDebug
            ./gradlew -p android assembleRelease
          else
            echo "Gradle wrapper not found in android/ or repository root. Falling back to CI bootstrapper."
            chmod +x ./ci-gradle-bootstrap.sh || true
            echo "Running Gradle via ci-gradle-bootstrap.sh with -p android"
            ./ci-gradle-bootstrap.sh -p android assembleDebug
            ./ci-gradle-bootstrap.sh -p android assembleRelease
          fi

      - name: List built APKs
        run: |
          echo "Debug APKs:"
          ls -la android/app/build/outputs/apk/debug/ || true
          echo "Release APKs:"
          ls -la android/app/build/outputs/apk/release/ || true

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: journalpix-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: warn

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: journalpix-release-apk
          # Cover signed (app-release.apk) and unsigned (app-release-unsigned.apk)
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/github' || github.ref == 'refs/heads/main')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Debug downloaded artifacts
        run: |
          echo "Listing artifacts dir:"
          ls -la artifacts || true
          echo
          find artifacts -type f -print || true

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' android/app/build.gradle | sed -E "s/.*versionName ['\"]([^'\"]+)['\"].*/\1/")
          # Append short SHA so re-runs on the same versionName don't conflict
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Resolved release version: ${VERSION}-${SHORT_SHA}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: JournalPix v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          body: |
            ## JournalPix Travel Vlog App

            ### Changes in this release:
            - Complete Android app with Rust backend
            - Map view with OpenMapView integration
            - SQLite and PostgreSQL database support
            - Timeline view with editable trips and places
            - Photo upload with EXIF geolocation extraction

            ### Assets:
            - Debug APK for testing
            - Release APK for production

            Commit: ${{ github.sha }}
          files: |
            artifacts/journalpix-debug-apk/**/*.apk
            artifacts/journalpix-release-apk/**/*.apk
          draft: false
          prerelease: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
