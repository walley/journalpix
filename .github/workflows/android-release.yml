name: Android Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
      
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Grant execute permission for gradlew
        run: chmod +x ./android/gradlew
        working-directory: .
      
      - name: Create keystore file
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/journalpix-release.keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
      
      - name: Build signed release APK
        run: ./android/gradlew assembleRelease
        working-directory: .
        env:
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
        if: env.ANDROID_SIGNING_KEY_ALIAS != ''
      
      - name: Rename APK with version
        run: |
          VERSION=${{ github.event.inputs.version || '1.0.0' }}
          mv android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/journalpix-$VERSION.apk
        working-directory: .
      
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: journalpix-release-apk
          path: android/app/build/outputs/apk/release/journalpix-*.apk
          retention-days: 90
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: JournalPix v${{ github.event.inputs.version || '1.0.0' }}
          tag_name: v${{ github.event.inputs.version || '1.0.0' }}
          body: |
            ## JournalPix Travel Vlog App - Release v${{ github.event.inputs.version || '1.0.0' }}
            
            ### Features:
            - Rust backend with Actix-web REST API
            - Android app with Jetpack Compose
            - Map view with OpenMapView
            - SQLite and PostgreSQL support
            - Timeline with editable trips and places
            - Photo upload with geolocation extraction
          files: android/app/build/outputs/apk/release/journalpix-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
