name: Continuous Integration

on:
  push:
    branches: [ github, main ]
  pull_request:
    branches: [ github, main ]
  workflow_dispatch:

jobs:
  test-backend:
    name: Test Rust Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
      
      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.toml') }}
      
      - name: Check code
        run: cd backend && cargo check
      
      - name: Run tests
        run: cd backend && cargo test

  test-android:
    name: Test Android App
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
      
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
      
      - name: Run tests
        run: ./android/gradlew test
        working-directory: .

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test-android
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
      
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
      
      - name: Build debug APK
        run: ./android/gradlew assembleDebug
        working-directory: .
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: journalpix-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
