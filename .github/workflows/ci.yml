name: Continuous Integration

on:
  push:
    branches: [ github, main ]
  pull_request:
    branches: [ github, main ]
  workflow_dispatch:

jobs:
  test-backend:
    name: Test Rust Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
      
      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.toml') }}
      
      - name: Check code
        run: cd backend && cargo check
      
      - name: Run tests
        run: cd backend && cargo test

  test-android:
    name: Test Android App
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          accept-licenses: true
      
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Debug: list repository & android dir
        run: |
          echo "Repository root:"
          ls -la
          echo
          echo "android/ (if present):"
          ls -la android || echo "android directory missing"

      - name: Run Android tests (handle gradlew location)
        run: |
          set -e
          if [ -f "android/gradlew" ]; then
            echo "Found android/gradlew — running tests from android/"
            chmod +x android/gradlew
            cd android
            ./gradlew test
          elif [ -f "./gradlew" ]; then
            echo "Found repository root gradlew — using it with -p android"
            chmod +x ./gradlew
            ./gradlew -p android test
          else
            echo "ERROR: Gradle wrapper not found in android/ or repository root."
            echo "To fix, commit the Gradle wrapper files (gradlew, gradlew.bat, gradle/wrapper/*)."
            ls -la
            exit 1
          fi

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test-android
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          accept-licenses: true
      
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Debug: list repository & android dir
        run: |
          echo "Repository root:"
          ls -la
          echo
          echo "android/ (if present):"
          ls -la android || echo "android directory missing"

      - name: Run Gradle build (handle gradlew location)
        run: |
          set -e
          if [ -f "android/gradlew" ]; then
            echo "Found android/gradlew — running from android/"
            chmod +x android/gradlew
            cd android
            ./gradlew assembleDebug
          elif [ -f "./gradlew" ]; then
            echo "Found repository root gradlew — using it with -p android"
            chmod +x ./gradlew
            ./gradlew -p android assembleDebug
          else
            echo "ERROR: Gradle wrapper not found in android/ or repository root."
            echo "To fix, commit the Gradle wrapper files (gradlew, gradlew.bat, gradle/wrapper/*)."
            ls -la
            exit 1
          fi
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: journalpix-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
