name: Backend Build and Test

on:
  push:
    branches: [ github, main ]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
  pull_request:
    branches: [ github, main ]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
  workflow_dispatch:

jobs:
  test:
    name: Test Rust Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
      
      - name: Cache cargo dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            backend/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.toml', 'backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Check Rust code
        run: cd backend && cargo check
      
      - name: Run tests
        run: cd backend && cargo test
      
      - name: Build release binary
        run: cd backend && cargo build --release
      
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: journalpix-backend
          path: backend/target/release/journalpix-backend
          retention-days: 30

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
        if: github.ref == 'refs/heads/github' || github.ref == 'refs/heads/main'
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: ${{ github.ref == 'refs/heads/github' || github.ref == 'refs/heads/main' }}
          tags: |
            walley/journalpix-backend:latest
            walley/journalpix-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
